name: Ligar App

on:
  schedule:
    - cron: '0 11 * * *' # Executa às 08:00 BRT (UTC+3)
  workflow_dispatch:

jobs:
  ligar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "FLYCTL_INSTALL=$HOME/.fly" >> $GITHUB_ENV
          echo "PATH=$HOME/.fly/bin:$PATH" >> $GITHUB_ENV

      - name: Autenticar no Fly.io
        run: fly auth token ${{ secrets.FLY_API_TOKEN }}

      - name: Escalar app no Fly.io
        run: fly scale count 1
